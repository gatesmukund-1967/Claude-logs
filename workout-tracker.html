<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Training Log</title>
<link rel="icon" type="image/png" href="workout-icon.png">
<link rel="apple-touch-icon" href="workout-icon.png">
<meta name="theme-color" content="#6fcf97">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#12141a;
    --surface:#1b1f27;
    --surface2:#242933;
    --border:#2e3440;
    --text:#edeff2;
    --muted:#8a9099;
    --muted2:#5b6068;
    --push:#6fcf97;
    --pull:#7aa2e8;
    --legs:#f0a860;
    --interval:#d98cd9;
    --danger:#e0616b;
    --radius:14px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0; background:var(--bg); color:var(--text); font-weight:500;
    font-family:'Inter',system-ui,sans-serif; -webkit-font-smoothing:antialiased;}
  body{padding-bottom:96px;}
  h1,h2,h3{font-family:'Space Grotesk',sans-serif; margin:0; font-weight:700;}
  .mono{font-family:'IBM Plex Mono',monospace;}
  button{font-family:inherit; border:none; background:none; color:inherit; cursor:pointer;}
  input,select{font-family:inherit; color:var(--text); background:var(--surface2); border:1px solid var(--border);
    border-radius:10px; padding:8px 10px; font-size:15px; width:100%;}
  input:focus,select:focus{outline:2px solid var(--push); outline-offset:1px;}

  header{position:sticky; top:0; z-index:20; background:var(--bg); padding:18px 16px 0;
    border-bottom:1px solid var(--border);}
  .brand{display:flex; align-items:baseline; justify-content:space-between; padding-bottom:12px;}
  .brand h1{font-size:20px; letter-spacing:.2px; font-weight:700;}
  .brand .date{font-size:12px; color:var(--muted); font-family:'IBM Plex Mono',monospace;}

  .tabs{display:flex; gap:4px; overflow-x:auto; padding-bottom:10px;}
  .tab-btn{flex-shrink:0; font-size:13px; font-weight:600; color:var(--muted); padding:8px 13px;
    border-radius:10px 10px 0 0; white-space:nowrap;}
  .tab-btn.active{color:var(--text); background:var(--surface);}

  main{padding:16px;}
  .section-label{font-size:11px; text-transform:uppercase; letter-spacing:.08em; color:var(--muted2);
    margin:18px 4px 8px; font-weight:600;}
  .section-label:first-child{margin-top:0;}

  .card{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius);
    padding:14px; margin-bottom:10px;}
  .ex-name{font-size:15.5px; font-weight:600;}
  .ex-meta{font-size:11.5px; color:var(--muted); margin-top:2px;}

  .set-row{display:flex; gap:8px; align-items:center; margin-top:10px;}
  .set-row .set-idx{font-size:11px; color:var(--muted2); width:16px; flex-shrink:0; font-family:'IBM Plex Mono',monospace;}
  .set-row input{text-align:center;}
  .set-row .unit{font-size:11px; color:var(--muted); flex-shrink:0; width:34px;}

  .spark{display:flex; align-items:flex-end; gap:3px; height:22px; margin-top:8px;}
  .spark .bar{width:5px; background:var(--muted2); border-radius:2px 2px 0 0; min-height:3px;}
  .spark .bar.cur.push{background:var(--push);}
  .spark .bar.cur.pull{background:var(--pull);}
  .spark .bar.cur.legs{background:var(--legs);}

  .save-btn{width:100%; background:var(--push); color:#0d1a12; font-weight:700; font-size:15px;
    padding:14px; border-radius:12px; text-align:center; margin-top:6px;}
  .save-btn.saved{background:var(--surface2); color:var(--push);}
  .save-btn:active{opacity:.85;}

  .empty{text-align:center; padding:32px 20px; color:var(--muted); font-size:13.5px;}

  .trend-table-wrap{overflow-x:auto; border:1px solid var(--border); border-radius:var(--radius);
    background:var(--surface); margin-bottom:14px;}
  table.trend-table{border-collapse:collapse; width:100%; font-size:12px;}
  table.trend-table th, table.trend-table td{padding:8px 9px; text-align:right; white-space:nowrap;
    border-bottom:1px solid var(--border);}
  table.trend-table th:first-child, table.trend-table td:first-child{text-align:left; position:sticky; left:0;
    background:var(--surface); font-family:'IBM Plex Mono',monospace; color:var(--muted); max-width:120px;
    overflow:hidden; text-overflow:ellipsis;}
  table.trend-table th{color:var(--muted); font-weight:600; font-size:10.5px; text-transform:uppercase;
    letter-spacing:.03em;}
  table.trend-table td{font-family:'IBM Plex Mono',monospace; color:var(--text);}
  table.trend-table tr:last-child td{border-bottom:none;}
  table.trend-table th.latest, table.trend-table td.latest{background:rgba(111,207,151,0.10); color:var(--push); font-weight:600;}

  .interval-block{background:var(--surface2); border-radius:10px; padding:10px; margin-bottom:8px;
    display:flex; gap:8px; align-items:center;}
  .interval-block .blk-num{font-size:11px; color:var(--muted2); width:16px; flex-shrink:0;}
  .add-block-btn{width:100%; border:1px dashed var(--border); border-radius:10px; padding:10px;
    color:var(--muted); font-size:13px; margin-top:6px;}

  .manage-row{display:flex; justify-content:space-between; align-items:center; background:var(--surface);
    border:1px solid var(--border); border-radius:12px; padding:12px 14px; margin-bottom:8px;}
  .manage-name{font-size:14px; font-weight:600;}
  .manage-meta{font-size:11.5px; color:var(--muted); margin-top:2px;}
  .icon-btn{font-size:13px; color:var(--muted); padding:6px 10px;}
  .icon-btn.del{color:var(--danger);}
</style>
</head>
<body>

  <div class="brand">
    <h1>Training Log</h1>
    <div class="date mono" id="todayLabel"></div>
  </div>

</header>

<main id="main"></main>

    DEFAULT_EXERCISES.push({...ex, id:'mixed-'+ex.id, day:'mixed', sets: ex.sets.map(s=>({...s}))});

// Estimated walking speed, calibrated directly from a measured 1km walk time at a
// known cadence — this is your actual stride, not a population-average formula.
// Scales proportionally if your typical cadence differs from the one you timed at.
let userPaceMinPerKm = 11.75; // measured: 1km took 11.5-12 min at the reference cadence
let userPaceCadenceSpm = 115; // the cadence you were at when you timed that km

function calibratedStrideM(){
  return 1000 / (userPaceMinPerKm * userPaceCadenceSpm);
}
function estimatedWalkSpeedKmh(){
  const strideM = calibratedStrideM();
  const cadence = userCadenceSpm || 110;
  return +(((cadence * strideM * 60) / 1000).toFixed(2));
}

// ACSM metabolic equations — gives kcal/min from treadmill speed + incline + bodyweight.
// Walking equation used up to 7km/h, running equation above that.
function metabolicKcalPerMin(speedKmh, inclinePercent, weightKg){
  if(!speedKmh) return 0;
  const speedMPerMin = speedKmh * 1000/60;
  const grade = (inclinePercent||0)/100;
  const vo2 = speedKmh<=7
    ? 0.1*speedMPerMin + 1.8*speedMPerMin*grade + 3.5
    : 0.2*speedMPerMin + 0.9*speedMPerMin*grade + 3.5;
  return (vo2 * weightKg / 1000) * 5; // 5 kcal per liter O2
}

// General MET-based kcal/min for activities that aren't a treadmill gait (cycling, elliptical, etc.)
// kcal/min = MET x 3.5 x weight(kg) / 200  — standard ACSM MET-to-kcal conversion
const EFFORT_MET = {easy:4.0, moderate:6.8, vigorous:10.0};
function metKcalPerMin(met, weightKg){
  return met * 3.5 * weightKg / 200;
}
function isCyclingActivity(activity){
  return /cycl|bike|bicycl|spin/i.test(activity||'');
}

// Assumed pace when a walk is logged with duration only — no distance, no speed
// (e.g. a walk without the watch). Deliberately conservative.
const ASSUMED_WALK_KMH = {easy:4.0, moderate:5.0, vigorous:6.0};

// Returns per-session breakdown plus totals, using the correct formula per modality —
// treadmill/walk/run gets the ACSM speed+incline equation, cycling gets a MET-based
// estimate (conservative "easy" default unless an effort level was set).
function estimateCardioForDate(date){
  let kcal = 0, km = 0, minutes = 0;
  const breakdown = [];

  const interval = intervalSessions.find(s=>s.date===date);
  if(interval){
    let ikcal=0, ikm=0, imin=0;
    interval.blocks.forEach(b=>{
      const durMin = (b.durationMin||0) + (b.durationSec||0)/60;
      ikcal += metabolicKcalPerMin(b.speed, b.incline, userWeightKg) * durMin;
      ikm += (b.speed||0) * (durMin/60);
      imin += durMin;
    });
    kcal += ikcal; km += ikm; minutes += imin;
    breakdown.push({modality:'Treadmill interval', durationMin:imin, km:ikm, kcal:ikcal});
  }

  cardioSessions.filter(s=>s.date===date).forEach(s=>{
    const durMin = (s.durationMin||0) + (s.durationSec||0)/60;
    if(durMin<=0) return;
    let sessionKcal = 0;
    let sessionKm = s.km || 0;
    let estimated = false;
    if(isCyclingActivity(s.activity)){
      const met = EFFORT_MET[s.effort] || EFFORT_MET.easy;
      sessionKcal = metKcalPerMin(met, userWeightKg) * durMin;
      if(!sessionKm) estimated = true; // no distance recorded for the ride
    } else {
      let speed = s.speed || (s.km ? s.km/(durMin/60) : 0);
      if(!speed){
        // Duration only — use your calibrated everyday pace, not a generic tier,
        // so this matches the quick-walk buttons exactly.
        speed = estimatedWalkSpeedKmh();
        estimated = true;
        sessionKm = speed * (durMin/60);
      }
      sessionKcal = metabolicKcalPerMin(speed, 0, userWeightKg) * durMin;
    }
    kcal += sessionKcal;
    km += sessionKm;
    minutes += durMin;
    breakdown.push({modality:s.activity||'Cardio', durationMin:durMin, km:sessionKm, kcal:sessionKcal, estimated});
  });

  // Warm-up/cool-down from any strength session that day — walking, not lifting,
  // so it's costed here at your calibrated everyday walking pace, not the resistance MET.
  const walkSpeed = estimatedWalkSpeedKmh();
  ['push','pull','legs','mixed','band'].forEach(day=>{
    const wu = getWarmup(date, day), cd = getCooldown(date, day);
    const extra = (wu!==''&&wu!==undefined?wu:0) + (cd!==''&&cd!==undefined?cd:0);
    if(extra<=0) return;
    const wcKm = walkSpeed * (extra/60);
    const wcKcal = metabolicKcalPerMin(walkSpeed, 0, userWeightKg) * extra;
    kcal += wcKcal; km += wcKm; minutes += extra;
    breakdown.push({modality:`Warm-up/cool-down (${DAYS.find(d=>d.id===day).label})`, durationMin:extra, km:wcKm, kcal:wcKcal, estimated:true});
  });

  return {kcal, km, minutes, breakdown};
}

// Resistance training MET ~5.0 (moderate-vigorous free weights, Compendium of Physical Activities).
// Only the actual lifting duration counts here — warm-up/cool-down are walking, costed
// separately as cardio (see estimateCardioForDate), not folded into the lifting total.
function estimateStrengthForDate(date){
  let kcal = 0, minutes = 0;
  ['push','pull','legs','mixed','band'].forEach(day=>{
    const durationMin = getSessionDuration(date, day);
    if(durationMin===''||durationMin===undefined) return;
    minutes += durationMin;
    kcal += 5.0 * userWeightKg * (durationMin/60);
  });
  return {kcal, minutes};
}

function loadAll(){
  try{
    const ex = localStorage.getItem(STORAGE_EX);
    if(ex){ exercises = JSON.parse(ex); } else { saveExercises(); }
    const s = localStorage.getItem(STORAGE_SESS);
    if(s){ sessions = JSON.parse(s); } else { saveSessions(); }

    if(iv){ intervalSessions = JSON.parse(iv); } else { saveIntervals(); }
    const cd = localStorage.getItem(STORAGE_CARDIO);
    if(cd){ cardioSessions = JSON.parse(cd); } else { saveCardio(); }
    let idsBackfilled = false;
    cardioSessions.forEach(s=>{
      if(!s.id){ s.id = Date.now().toString(36)+Math.random().toString(36).slice(2,6); idsBackfilled = true; }
    });
    if(idsBackfilled) saveCardio();
    const nt = localStorage.getItem(STORAGE_NOTES);
    if(nt){ sessionNotes = JSON.parse(nt); } else { saveNotes(); }
    const de = localStorage.getItem(STORAGE_DELETED);
    if(de) deletedExerciseIds = JSON.parse(de);
    const dsk = localStorage.getItem(STORAGE_DELETED_SESSIONS);
    if(dsk) deletedSessionKeys = JSON.parse(dsk);
    const wKg = localStorage.getItem('userWeightKg');
    if(wKg) userWeightKg = parseFloat(wKg);
    const hCm = localStorage.getItem('userHeightCm');
    if(hCm) userHeightCm = parseFloat(hCm);
    const cSpm = localStorage.getItem('userCadenceSpm');
    if(cSpm) userCadenceSpm = parseFloat(cSpm);
    const pMin = localStorage.getItem('userPaceMinPerKm');
    if(pMin) userPaceMinPerKm = parseFloat(pMin);
    const pCad = localStorage.getItem('userPaceCadenceSpm');
    if(pCad) userPaceCadenceSpm = parseFloat(pCad);
  }catch(e){
    console.warn('localStorage load failed:', e);
  }

  let merged = false;
  // The saved exercise catalog replaces the built-in one wholesale, so exercises added
  // to DEFAULT_EXERCISES in a later version would otherwise never appear for anyone who
  // already had data saved. Merge in anything missing, matched on id — but never
  // resurrect something you deliberately deleted in Manage.
  DEFAULT_EXERCISES.forEach(seed=>{
    const idx = exercises.findIndex(e=>e.id===seed.id);
    if(idx<0){
      if(!deletedExerciseIds.includes(seed.id)){
        exercises.push({...seed, sets: seed.sets.map(s=>({...s}))});
        merged = true;
      }
      return;
    }
    // Exercise already exists locally — sync definitional metadata (not logged
    // history) so a later code fix like the "occasional" flag actually reaches
    // browsers that already cached an older version of this catalog entry.
    if(exercises[idx].occasional !== seed.occasional){
      exercises[idx].occasional = seed.occasional;
      merged = true;
    }
    if(exercises[idx].name !== seed.name){
      exercises[idx].name = seed.name;
      merged = true;
    }
  });
  if(merged) saveExercises();

  let sessionsMerged = false;
  DEFAULT_SESSIONS.forEach(seed=>{
    const key = `${seed.date}|${seed.exerciseId}`;
    if(!sessions.some(s=>s.date===seed.date && s.exerciseId===seed.exerciseId) && !deletedSessionKeys.includes(key)){
      sessions.push({...seed, sets: seed.sets.map(x=>({...x}))});
      sessionsMerged = true;
    }
  });
  DEFAULT_INTERVALS.forEach(seed=>{
    if(!intervalSessions.some(s=>s.date===seed.date)){
      intervalSessions.push({...seed, blocks: seed.blocks.map(b=>({...b}))});
      sessionsMerged = true;
    }
  });
  let notesMerged = false;
  DEFAULT_NOTES.forEach(seed=>{
    if(!sessionNotes.some(n=>n.date===seed.date && n.day===seed.day)){
      sessionNotes.push({...seed});
      notesMerged = true;
    }
  });
  if(sessionsMerged){
    sessions.sort((a,b)=>a.date.localeCompare(b.date));
    intervalSessions.sort((a,b)=>a.date.localeCompare(b.date));
    saveSessions();
    saveIntervals();
  }
  if(notesMerged) saveNotes();
}

function fmtIntervalDuration(min, sec){
  const total = (min||0)*60 + (sec||0);
  if(total < 180) return `${total} sec`;
  const m = Math.floor(total/60), s = total%60;
  return s ? `${m}:${String(s).padStart(2,'0')} min` : `${m} min`;
}

// Collapses consecutive identical blocks into "N × duration @ speed km/h, incline% incline"
// so a repeated interval structure reads the way a coach would write it, e.g.:
// "9 × 75 sec @ 6.5 km/h, 4% incline" instead of listing all 9 blocks individually.
function formatIntervalBlocks(blocks){
  if(!blocks || !blocks.length) return '';
  const desc = b => `${fmtIntervalDuration(b.durationMin, b.durationSec)} @ ${b.speed} km/h, ${b.incline}% incline`;

  // If the session uses the warm-up / work+recovery / cool-down structure, describe it
  // the way a coach would read it rather than listing every block.
  const hasKinds = blocks.some(b=>b.kind);
  if(hasKinds){
    const parts = [];
    const warm = blocks.filter(b=>b.kind==='warmup');
    warm.forEach(b=>parts.push(`warm-up ${desc(b)}`));

    const works = blocks.filter(b=>b.kind==='work');
    const recs  = blocks.filter(b=>b.kind==='recovery');
    if(works.length){
      const allSameWork = works.every(b=>b.speed===works[0].speed && b.incline===works[0].incline
        && b.durationMin===works[0].durationMin && b.durationSec===works[0].durationSec);
      if(allSameWork){
        let line = `${works.length} × ${desc(works[0])}`;
        if(recs.length){
          const allSameRec = recs.every(b=>b.speed===recs[0].speed && b.incline===recs[0].incline
            && b.durationMin===recs[0].durationMin && b.durationSec===recs[0].durationSec);
          line += allSameRec
            ? ` with ${fmtIntervalDuration(recs[0].durationMin, recs[0].durationSec)} recovery @ ${recs[0].speed} km/h`
            : ` with varied recoveries`;
        }
        parts.push(line);
      } else {
        parts.push(`work: ${works.map(desc).join(', ')}`);
        if(recs.length) parts.push(`recovery: ${recs.map(desc).join(', ')}`);
      }
    }
    const cool = blocks.filter(b=>b.kind==='cooldown');
    cool.forEach(b=>parts.push(`cool-down ${desc(b)}`));
    if(parts.length) return parts.join(' / ');
  }

  // Fallback for older sessions with no kind labels: collapse consecutive identical blocks
  const groups = [];
  blocks.forEach(b=>{
    const last = groups[groups.length-1];
    const key = `${b.speed}|${b.incline}|${b.durationMin||0}|${b.durationSec||0}`;
    if(last && last.key===key){ last.count++; }
    else { groups.push({key, count:1, speed:b.speed, incline:b.incline, durationMin:b.durationMin, durationSec:b.durationSec}); }
  });
  return groups.map(g=>{
    const dur = fmtIntervalDuration(g.durationMin, g.durationSec);
    const countPrefix = g.count>1 ? `${g.count} × ` : '';
    return `${countPrefix}${dur} @ ${g.speed} km/h, ${g.incline}% incline`;
  }).join(' / ');
}

function lastSetsFor(exerciseId){
  for(let i=sessions.length-1;i>=0;i--){
    if(sessions[i].exerciseId===exerciseId) return sessions[i].sets;
  }
  const ex = exercises.find(e=>e.id===exerciseId);
  return ex ? ex.sets.map(s=>({...s})) : [];
}

let dayDraftDate = new Date().toISOString().slice(0,10);

function sessionSetsFor(exerciseId, date){
  const sess = sessions.find(s=>s.exerciseId===exerciseId && s.date===date);
  return sess ? sess.sets.map(s=>({...s})) : null;
}

function initDraft(day, date){
  dayDraftDate = date || new Date().toISOString().slice(0,10);
  draft = {};
  exercises.filter(e=>e.day===day).forEach(e=>{
    const existing = sessionSetsFor(e.id, dayDraftDate);
    if(existing){
      draft[e.id] = existing;
      return;
    }
    if(day==='mixed' || day==='interval' || day==='cardio' || e.occasional){
      // Mixed/Interval/Cardio arm work, and any exercise flagged "occasional"
      // (not done every session — e.g. Box Squat, Leg Press, Leg Raise), start
      // blank so untouched exercises never look like they've already been logged.
      const blank = s => {
        const b = {};
        if('weight' in s) b.weight='';
        if('reps' in s) b.reps='';
        if('duration' in s) b.duration='';
        return b;
      };
      draft[e.id] = e.sets.map(blank);
    } else {
      draft[e.id] = lastSetsFor(e.id).map(s=>({...s}));
    }
  });
  notesDraft = getNote(dayDraftDate, day);
  durationDraft = getSessionDuration(dayDraftDate, day);
  warmupDraft = getWarmup(dayDraftDate, day);
  cooldownDraft = getCooldown(dayDraftDate, day);
}
// A session template that mirrors how the workout actually runs, so the skeleton
// doesn't have to be rebuilt each time. Extra work/recovery pairs get added as needed.
// The session is defined compactly — one work interval, one recovery, and a repeat
// count — rather than as N duplicated blocks. It's expanded into blocks only for
// distance/calorie maths and reporting, so nothing downstream had to change.
function defaultIntervalStruct(){
  return {
    warmup:   {speed:5,   incline:2,   min:5, sec:0},
    work:     {speed:6.8, incline:3.5, min:1, sec:0},
    recovery: {speed:4,   incline:3.5, min:2, sec:0},
    rounds:   9,
    cooldowns:[{speed:3.5, incline:1, min:5, sec:0}],
  };
}

function expandIntervalStruct(st){
  if(!st) return [];
  const mk = (o,kind)=>({kind, speed:o.speed, incline:o.incline, durationMin:o.min||0, durationSec:o.sec||0});
  const blocks = [];
  if(st.warmup && (st.warmup.min || st.warmup.sec)) blocks.push(mk(st.warmup,'warmup'));
  for(let i=0;i<(st.rounds||0);i++){
    if(st.work && (st.work.min || st.work.sec)) blocks.push(mk(st.work,'work'));
    if(st.recovery && (st.recovery.min || st.recovery.sec)) blocks.push(mk(st.recovery,'recovery'));
  }
  (st.cooldowns||[]).forEach(c=>{ if(c.min || c.sec) blocks.push(mk(c,'cooldown')); });
  return blocks;
}

// Rebuild the compact structure from a stored block list, for sessions saved
// before the structure was kept alongside the blocks.
function structFromBlocks(blocks){
  const st = defaultIntervalStruct();
  const g = k => blocks.filter(b=>b.kind===k);
  const toO = b => ({speed:b.speed, incline:b.incline, min:b.durationMin||0, sec:b.durationSec||0});
  const w = g('warmup'), wk = g('work'), rc = g('recovery'), cd = g('cooldown');
  if(w.length) st.warmup = toO(w[0]);
  if(wk.length){ st.work = toO(wk[0]); st.rounds = wk.length; }
  if(rc.length) st.recovery = toO(rc[0]);
  if(cd.length) st.cooldowns = cd.map(toO);
  if(!wk.length && blocks.length){
    // Unlabelled legacy session — treat every block as a work interval
    st.work = toO(blocks[0]);
    st.rounds = blocks.length;
    st.warmup = {speed:5, incline:2, min:0, sec:0};
    st.recovery = {speed:4, incline:3.5, min:0, sec:0};
    st.cooldowns = [];
  }
  return st;
}

// Shared by every place that saves an exercise's sets against a date+day, so clearing
// a previously-logged exercise actually removes it — and stays removed, rather than
// getting silently resurrected by the seed-merge on next load.
function saveOrClearExerciseEntry(date, day, exId, sets){
  const existingIdx = sessions.findIndex(s=>s.date===date && s.exerciseId===exId);
  const key = `${date}|${exId}`;
  if(!sets.length){
    if(existingIdx>=0){
      sessions.splice(existingIdx,1);
      if(!deletedSessionKeys.includes(key)) deletedSessionKeys.push(key);
    }
    return;
  }
  const entry = {date, day, exerciseId:exId, sets};
  if(existingIdx>=0) sessions[existingIdx] = entry; else sessions.push(entry);
  const dIdx = deletedSessionKeys.indexOf(key);
  if(dIdx>=0) deletedSessionKeys.splice(dIdx,1);
}
function persistDeletedSessionKeys(){
  try{ localStorage.setItem(STORAGE_DELETED_SESSIONS, JSON.stringify(deletedSessionKeys)); }catch(e){}
}

function initIntervalDraft(date){
  intervalDraftDate = date || new Date().toISOString().slice(0,10);
  const existing = intervalSessions.find(s=>s.date===intervalDraftDate);
  if(existing){
    intervalStruct = existing.structure ? JSON.parse(JSON.stringify(existing.structure)) : structFromBlocks(existing.blocks||[]);
  } else {
    const last = intervalSessions[intervalSessions.length-1];
    intervalStruct = last && last.structure
      ? JSON.parse(JSON.stringify(last.structure))
      : defaultIntervalStruct();
  }
  intervalNotesDraft = getNote(intervalDraftDate, 'interval');
}

function recentTopSetValue(exerciseId, key){
  const vals=[];
  for(let i=sessions.length-1;i>=0 && vals.length<6;i--){
    if(sessions[i].exerciseId===exerciseId && sessions[i].sets.length){
      const top = sessions[i].sets.reduce((a,b)=> (b[key]||0) > (a[key]||0) ? b : a, sessions[i].sets[0]);
      if(top[key]!==undefined) vals.push(top[key]);
    }
  }
  return vals.reverse();
}
function sparkHtml(exerciseId, key, dayClass){
  const vals = recentTopSetValue(exerciseId, key);
  if(vals.length<2) return '';
  const max = Math.max(...vals), min = Math.min(...vals);
  const range = (max-min) || 1;
  const bars = vals.map((v,i)=>{
    const h = Math.max(4, Math.round(((v-min)/range)*22));
    return `<div class="bar ${i===vals.length-1?'cur '+dayClass:''}" style="height:${h}px" title="${v}"></div>`;
  }).join('');
  return `<div class="spark">${bars}</div>`;
}

function renderExerciseCards(day){
  const dayExercises = exercises.filter(e=>e.day===day);
  let html = '';
  dayExercises.forEach(ex=>{

    html += `<div class="card">
      <div class="ex-name">${ex.name}</div>
      <div class="ex-meta">${isCarry ? 'weight (kg) × duration (sec)' : isDuration ? 'duration (sec)' : isReps ? 'reps' : 'weight (kg) × reps'}</div>
      ${sets.map((s,i)=>`
        <div class="set-row" data-ex="${ex.id}" data-set="${i}">
          <div class="set-idx">${i+1}</div>
          ${isCarry
            ? `<input type="number" inputmode="decimal" class="set-input" data-field="weight" value="${s.weight??''}" placeholder="kg">
               <span class="unit">×</span>
               <input type="number" inputmode="decimal" class="set-input" data-field="duration" value="${s.duration??''}" placeholder="sec">`
            : isDuration
            ? `<input type="number" inputmode="decimal" class="set-input" data-field="duration" value="${s.duration??''}" placeholder="sec">`
            : isReps
            ? `<input type="number" inputmode="decimal" class="set-input" data-field="reps" value="${s.reps??''}" placeholder="reps">`
            : `<input type="number" inputmode="decimal" class="set-input" data-field="weight" value="${s.weight??''}" placeholder="kg">
               <span class="unit">×</span>
               <input type="number" inputmode="decimal" class="set-input" data-field="reps" value="${s.reps??''}" placeholder="reps">`
          }
          <button class="icon-btn del" data-remove-set="${ex.id}|${i}" style="padding:2px 8px; flex-shrink:0;">✕</button>
        </div>`).join('')}
      <button class="icon-btn" data-add-set="${ex.id}" style="margin-top:6px; color:var(--muted); font-size:12px;">+ Add set</button>
      ${sparkHtml(ex.id, isCarry?'weight':(isDuration?'duration':(isReps?'reps':'weight')), day)}
    </div>`;
  });
  return html;
}

function updateIntervalTotals(){
  const el = document.getElementById('intervalTotals');
  if(!el || !intervalStruct) return;
  const blocks = expandIntervalStruct(intervalStruct);
  let totMin=0, totKm=0;
  blocks.forEach(b=>{
    const d = (b.durationMin||0) + (b.durationSec||0)/60;
    totMin += d; totKm += (b.speed||0)*(d/60);

  el.textContent = `${totMin.toFixed(0)} min · ${totKm.toFixed(2)} km`;
}

  let totMin=0, totKm=0;
  blocks.forEach(b=>{
    const d = (b.durationMin||0) + (b.durationSec||0)/60;
    totMin += d; totKm += (b.speed||0)*(d/60);
  });
  html += `<div class="card" style="text-align:center; margin-top:10px;">
    <div class="ex-meta">Session total</div>
    <div class="mono" id="intervalTotals" style="font-size:18px; font-weight:700; margin-top:4px;">${totMin.toFixed(0)} min · ${totKm.toFixed(2)} km</div>
  </div>`;

  html += `<div class="section-label" style="margin-top:18px;">Arm accessory (optional)</div>`;
  html += renderExerciseCards('interval');
  html += `<div class="section-label" style="margin-top:18px;">Session notes</div><div class="card">
    <textarea id="intervalNotesInput" placeholder="How it felt, effort level, anything numbers won\'t capture" style="width:100%; min-height:70px; background:var(--surface2);
      border:1px solid var(--border); border-radius:10px; padding:10px; color:var(--text); font-size:13.5px; line-height:1.5;">${intervalNotesDraft}</textarea>
  </div>`;
  const existingForDate = intervalSessions.some(s=>s.date===intervalDraftDate);
  html += `<button class="save-btn" id="saveIntervalBtn" style="margin-top:6px;">${existingForDate ? 'Update this session' : 'Save interval session'}</button>`;

  if(intervalSessions.length){
    html += `<div class="section-label" style="margin-top:22px;">Recent interval sessions <span style="text-transform:none; font-weight:400;">— tap to edit</span></div>`;
    [...intervalSessions].reverse().slice(0,8).forEach(s=>{
      const summary = formatIntervalBlocks(s.blocks);
      html += `<div class="card" data-edit-interval="${s.date}" style="cursor:pointer;"><div class="ex-meta mono">${fmtDateDDMM(s.date)}</div><div class="ex-meta" style="margin-top:4px;">${summary}</div></div>`;
    });
  }
  return html;
}

function buildExerciseTrendTable(day, n=8){
  const dayExercises = exercises.filter(e=>e.day===day);
  const dates = [...new Set(sessions.filter(s=>s.day===day).map(s=>s.date))].sort().slice(-n);
  if(!dates.length) return '<div class="empty">No sessions logged yet.</div>';
  const head = `<tr><th>Exercise</th>${dates.map((d,i)=>`<th class="${i===dates.length-1?'latest':''}">${fmtDateDDMM(d)}</th>`).join('')}</tr>`;
  const body = dayExercises.map(ex=>{
    const cells = dates.map((d,i)=>{
      const sess = sessions.find(s=>s.day===day && s.date===d && s.exerciseId===ex.id);
      let val = '—';
      if(sess && sess.sets.length){
        val = ex.unit==='sec'
          ? sess.sets.map(s=>s.duration).join('/')
          : ex.unit==='kg-sec'
          ? sess.sets.map(s=>`${s.weight}kg/${s.duration}s`).join(', ')
          : ex.unit==='reps'
          ? sess.sets.map(s=>s.reps).join('/')
          : sess.sets.map(s=>`${s.weight}×${s.reps}`).join(', ');
      }
      return `<td class="${i===dates.length-1?'latest':''}">${val}</td>`;
    }).join('');
    return `<tr><td>${ex.name}</td>${cells}</tr>`;
  }).join('');
  return `<div class="trend-table-wrap"><table class="trend-table">${head}${body}</table></div>`;
}

function buildReportText(days=30){
  const cutoff = new Date(); cutoff.setDate(cutoff.getDate()-days);
  const cutoffISO = cutoff.toISOString().slice(0,10);
  let lines = [];
  lines.push(`Training log summary — last ${days} days (generated ${fmtDateDDMM(todayISO())}/2026)`);
  lines.push('');

  ['push','pull','legs','mixed','band'].forEach(day=>{
    const dayExercises = exercises.filter(e=>e.day===day);
    const dayLabel = DAYS.find(d=>d.id===day).label;
    const relevant = sessions.filter(s=>s.day===day && s.date>=cutoffISO);
    if(!relevant.length) return;
    lines.push(`## ${dayLabel}`);
    const dates = [...new Set(relevant.map(s=>s.date))].sort();
    dates.forEach(date=>{
      const daySessions = relevant.filter(s=>s.date===date);
      const parts = daySessions.map(s=>{
        const ex = exercises.find(e=>e.id===s.exerciseId);
        const name = ex ? ex.name : s.exerciseId;
        const setStr = ex && ex.unit==='sec'
          ? s.sets.map(x=>x.duration).filter(v=>v!==undefined&&v!=='').join('/')+'s'
          : ex && ex.unit==='kg-sec'
          ? s.sets.filter(x=>x.weight!==undefined&&x.weight!=='').map(x=>`${x.weight}kg/${x.duration}s`).join(', ')
          : ex && ex.unit==='reps'
          ? s.sets.filter(x=>x.reps!==undefined&&x.reps!=='').map(x=>x.reps).join(', ')+' reps'
          : s.sets.filter(x=>x.weight!==undefined&&x.weight!=='').map(x=>`${x.weight}kg×${x.reps}`).join(', ');
        return `${name}: ${setStr}`;
      });
      lines.push(`${fmtDateDDMM(date)} — ${parts.join(' | ')}`);
      const wu = getWarmup(date, day), cd = getCooldown(date, day);
      if(wu!=='' || cd!=='') lines.push(`  ${wu!==''?`Warm-up: ${wu} min`:''}${wu!==''&&cd!==''?' · ':''}${cd!==''?`Cool-down: ${cd} min`:''}`);
      const note = getNote(date, day);
      if(note) lines.push(`  Notes: ${note}`);
    });
    lines.push('');
  });

  const relevantIntervals = intervalSessions.filter(s=>s.date>=cutoffISO);
  if(relevantIntervals.length){
    lines.push('## Interval sessions');
    relevantIntervals.forEach(s=>{
      const summary = formatIntervalBlocks(s.blocks);
      lines.push(`${fmtDateDDMM(s.date)} — ${summary}`);
      const note = getNote(s.date, 'interval');
      if(note) lines.push(`  Notes: ${note}`);
    });
    lines.push('');
  }

  const relevantCardio = cardioSessions.filter(s=>s.date>=cutoffISO);
  if(relevantCardio.length){
    lines.push('## Cardio sessions');
    relevantCardio.forEach(s=>{
      const time = `${s.durationMin||0}:${String(s.durationSec||0).padStart(2,'0')}`;
      lines.push(`${fmtDateDDMM(s.date)} — ${s.activity||'Cardio'}, ${s.km||0}km in ${time}${s.speed?`, ${s.speed}km/h avg`:''}`);
      const note = getNote(s.date, 'cardio');
      if(note) lines.push(`  Notes: ${note}`);
    });
    lines.push('');
  }

  if(lines.length<=2){
    lines.push('No sessions logged in this window yet.');
  }
  return lines.join('\n');
}

function buildDailyReportText(date){
  let lines = [];
  lines.push(`Training log — ${fmtDateDDMM(date)}/2026`);
  lines.push('');

  ['push','pull','legs','mixed','band'].forEach(day=>{
    const daySessions = sessions.filter(s=>s.day===day && s.date===date);
    if(!daySessions.length) return;
    const dayLabel = DAYS.find(d=>d.id===day).label;
    lines.push(`## ${dayLabel}`);
    daySessions.forEach(s=>{
      const ex = exercises.find(e=>e.id===s.exerciseId);
      const name = ex ? ex.name : s.exerciseId;
      const setStr = ex && ex.unit==='sec'
        ? s.sets.map(x=>x.duration).filter(v=>v!==undefined&&v!=='').join('/')+'s'
        : ex && ex.unit==='kg-sec'
        ? s.sets.filter(x=>x.weight!==undefined&&x.weight!=='').map(x=>`${x.weight}kg/${x.duration}s`).join(', ')
        : ex && ex.unit==='reps'
        ? s.sets.filter(x=>x.reps!==undefined&&x.reps!=='').map(x=>x.reps).join(', ')+' reps'
        : s.sets.filter(x=>x.weight!==undefined&&x.weight!=='').map(x=>`${x.weight}kg×${x.reps}`).join(', ');
      lines.push(`${name}: ${setStr}`);
    });
    const wu = getWarmup(date, day), cd = getCooldown(date, day);
    if(wu!=='' || cd!==''){
      lines.push('');
      lines.push(`${wu!==''?`Warm-up: ${wu} min`:''}${wu!==''&&cd!==''?' · ':''}${cd!==''?`Cool-down: ${cd} min`:''}`);
    }
    const note = getNote(date, day);
    if(note){ lines.push(''); lines.push(`Notes: ${note}`); }
    lines.push('');
  });

  const interval = intervalSessions.find(s=>s.date===date);
  if(interval){
    lines.push('## Interval');
    const summary = formatIntervalBlocks(interval.blocks);
    lines.push(summary);
    const note = getNote(date, 'interval');
    if(note){ lines.push(''); lines.push(`Notes: ${note}`); }
    lines.push('');
  }

  const cardioEntries = cardioSessions.filter(s=>s.date===date);
  if(cardioEntries.length){
    lines.push('## Cardio');
    let totalKm = 0;
    cardioEntries.forEach(cardio=>{
      const time = `${cardio.durationMin||0} min`;
      const kmStr = cardio.km ? `${cardio.km}km` : '';
      const speedStr = cardio.speed ? `${cardio.speed}km/h` : '';
      const parts = [time, kmStr, speedStr].filter(Boolean);
      lines.push(`• ${cardio.activity||'Cardio'}: ${parts.join(', ')}`);
      totalKm += cardio.km||0;
    });
    if(cardioEntries.length>1) lines.push(`Total: ${totalKm.toFixed(1)}km`);
    const note = getNote(date, 'cardio');
    if(note){ lines.push(''); lines.push(`Notes: ${note}`); }
    lines.push('');
  }

  if(lines.length<=2){
    lines.push('Nothing logged on this date.');
  }
  return lines.join('\n');
}

function render(){
  document.getElementById('todayLabel').textContent = todayLabel();
  document.getElementById('tabs').innerHTML = DAYS.map(d=>
    `<button class="tab-btn ${activeTab===d.id?'active':''}" data-tab="${d.id}">${d.label}</button>`).join('');

  let html = '';
  if(activeTab==='today') html = renderTodayTab();
  else if(['push','pull','legs','mixed','band'].includes(activeTab)) html = renderDayTab(activeTab);
  else if(activeTab==='interval') html = renderIntervalTab();
  else if(activeTab==='cardio') html = renderCardioTab();
  else if(activeTab==='history') html = renderHistoryTab();
  else if(activeTab==='report') html = renderReportTab();
  else if(activeTab==='manage') html = renderManageTab();

  document.getElementById('main').innerHTML = html;
  attachEvents();
}

function attachEvents(){
  document.querySelectorAll('[data-tab]').forEach(btn=>{
    btn.onclick = ()=>{
      activeTab = btn.dataset.tab;
      if(['push','pull','legs','mixed','band'].includes(activeTab)) initDraft(activeTab);
      if(activeTab==='interval'){ initIntervalDraft(); initDraft('interval'); }
      if(activeTab==='cardio'){ initCardioDraft(); initDraft('cardio'); }
      render();
    };
  });

  document.querySelectorAll('.set-input').forEach(inp=>{
    inp.oninput = ()=>{
      const row = inp.closest('.set-row');
      const exId = row.dataset.ex, idx = parseInt(row.dataset.set);
      draft[exId][idx][inp.dataset.field] = inp.value===''?'':parseFloat(inp.value);
    };
  });
  document.querySelectorAll('[data-remove-set]').forEach(btn=>{
    btn.onclick = ()=>{
      const [exId, idx] = btn.dataset.removeSet.split('|');
      draft[exId].splice(parseInt(idx),1);
      render();
    };
  });
  document.querySelectorAll('[data-add-set]').forEach(btn=>{
    btn.onclick = ()=>{
      const exId = btn.dataset.addSet;
      const last = draft[exId][draft[exId].length-1] || {};
      draft[exId].push({...last});
      render();
    };
  });

  const todayDateInp = document.getElementById('todayDate');
  if(todayDateInp) todayDateInp.onchange = ()=>{ todayViewDate = todayDateInp.value; render(); };

  document.querySelectorAll('[data-open-day]').forEach(card=>{
    card.onclick = ()=>{
      const day = card.dataset.openDay;
      activeTab = day;
      if(['push','pull','legs','mixed','band'].includes(day)) initDraft(day, todayViewDate);
      else if(day==='interval'){ initIntervalDraft(todayViewDate); initDraft('interval', todayViewDate); }
      else if(day==='cardio'){ initCardioDraft(todayViewDate, null); initDraft('cardio', todayViewDate); }
      render();
      window.scrollTo({top:0, behavior:'smooth'});
    };
  });

  const dayDateInp = document.getElementById('dayDate');
  if(dayDateInp) dayDateInp.onchange = ()=>{ initDraft(activeTab, dayDateInp.value); render(); };

  const sessionNotesEl = document.getElementById('sessionNotesInput');
  if(sessionNotesEl) sessionNotesEl.oninput = ()=>{ notesDraft = sessionNotesEl.value; };
  const sessionDurationEl = document.getElementById('sessionDurationInput');
  if(sessionDurationEl) sessionDurationEl.oninput = ()=>{ durationDraft = sessionDurationEl.value; };
  document.querySelectorAll('[data-log-walk]').forEach(btn=>{
    btn.onclick = async ()=>{
      const label = btn.dataset.logWalk;
      const row = btn.closest('div');
      const minInp = row.querySelector('.quick-walk-min');
      const mins = parseFloat(minInp.value);
      if(!mins || mins<=0){ alert('Enter minutes for this walk.'); return; }
      const speed = estimatedWalkSpeedKmh();
      const km = speed * (mins/60);
      cardioSessions.push({
        id: Date.now().toString(36)+Math.random().toString(36).slice(2,6),
        date: dayDraftDate,
        activity: label,
        km: +km.toFixed(2),
        durationMin: Math.floor(mins),
        durationSec: Math.round((mins%1)*60),
        speed,
        effort: 'easy',
        pace: 'cadence',
      });
      cardioSessions.sort((a,b)=>a.date.localeCompare(b.date));
      await saveCardio();
      render();
    };
  });

  const warmupEl = document.getElementById('warmupInput');
  if(warmupEl) warmupEl.oninput = ()=>{ warmupDraft = warmupEl.value; };
  const cooldownEl = document.getElementById('cooldownInput');
  if(cooldownEl) cooldownEl.oninput = ()=>{ cooldownDraft = cooldownEl.value; };

  const saveSessBtn = document.getElementById('saveSessionBtn');
  if(saveSessBtn) saveSessBtn.onclick = async ()=>{
    const date = document.getElementById('dayDate').value || dayDraftDate;
    Object.keys(draft).forEach(exId=>{
      const sets = draft[exId].filter(s=>(s.weight!==undefined&&s.weight!=='') || (s.reps!==undefined&&s.reps!=='') || (s.duration!==undefined&&s.duration!==''));
      saveOrClearExerciseEntry(date, activeTab, exId, sets);
    });
    persistDeletedSessionKeys();
    await setNote(date, activeTab, (notesDraft||'').trim());
    await setSessionDuration(date, activeTab, durationDraft===''?'':parseFloat(durationDraft));
    await setWarmup(date, activeTab, warmupDraft===''?'':parseFloat(warmupDraft));
    await setCooldown(date, activeTab, cooldownDraft===''?'':parseFloat(cooldownDraft));
    await saveSessions();
    saveSessBtn.textContent = 'Saved ✓';
    saveSessBtn.classList.add('saved');
    setTimeout(()=>{ render(); },900);
  };

  const intervalDateInp = document.getElementById('intervalDate');
  if(intervalDateInp) intervalDateInp.onchange = ()=>{ initIntervalDraft(intervalDateInp.value); render(); };

  // Segment editors write into the compact structure via a dotted path
  document.querySelectorAll('.seg-input').forEach(inp=>{
    inp.oninput = inp.onchange = ()=>{
      const parts = inp.dataset.path.split('.');
      let target = intervalStruct;
      for(let i=0;i<parts.length-1;i++) target = target[parts[i]];
      const v = inp.value==='' ? 0 : parseFloat(inp.value);
      target[parts[parts.length-1]] = isNaN(v) ? 0 : v;
      updateIntervalTotals();
    };
  });
  const roundsMinus = document.getElementById('roundsMinus');
  if(roundsMinus) roundsMinus.onclick = ()=>{
    intervalStruct.rounds = Math.max(1, (intervalStruct.rounds||1) - 1);
    render();
  };
  const roundsPlus = document.getElementById('roundsPlus');
  if(roundsPlus) roundsPlus.onclick = ()=>{
    intervalStruct.rounds = (intervalStruct.rounds||0) + 1;
    render();
  };
  const addCooldownBtn = document.getElementById('addCooldownBtn');
  if(addCooldownBtn) addCooldownBtn.onclick = ()=>{
    const last = (intervalStruct.cooldowns||[]).slice(-1)[0];
    intervalStruct.cooldowns = intervalStruct.cooldowns || [];
    intervalStruct.cooldowns.push(last ? {...last} : {speed:3.5, incline:1, min:2, sec:0});
    render();
  };
  document.querySelectorAll('[data-remove-cd]').forEach(btn=>{
    btn.onclick = ()=>{ intervalStruct.cooldowns.splice(parseInt(btn.dataset.removeCd),1); render(); };
  });
  const intervalNotesEl = document.getElementById('intervalNotesInput');
  if(intervalNotesEl) intervalNotesEl.oninput = ()=>{ intervalNotesDraft = intervalNotesEl.value; };
  document.querySelectorAll('[data-edit-interval]').forEach(card=>{
    card.onclick = ()=>{
      initIntervalDraft(card.dataset.editInterval);
      initDraft('interval', card.dataset.editInterval);
      render();
      window.scrollTo({top:0, behavior:'smooth'});
    };
  });
  const saveIntBtn = document.getElementById('saveIntervalBtn');
  if(saveIntBtn) saveIntBtn.onclick = async ()=>{
    const date = document.getElementById('intervalDate').value || intervalDraftDate;
    // Normalise any seconds overflow (e.g. 75 sec -> 1:15) before expanding
    ['warmup','work','recovery'].forEach(k=>{
      const o = intervalStruct[k];
      if(!o) return;
      const t = Math.round((o.min||0)*60 + (o.sec||0));
      o.min = Math.floor(t/60); o.sec = t%60;
    });
    (intervalStruct.cooldowns||[]).forEach(o=>{
      const t = Math.round((o.min||0)*60 + (o.sec||0));
      o.min = Math.floor(t/60); o.sec = t%60;
    });
    const blocks = expandIntervalStruct(intervalStruct);
    const existingIdx = intervalSessions.findIndex(s=>s.date===date);
    const entry = {date, blocks, structure: JSON.parse(JSON.stringify(intervalStruct))};
    if(existingIdx>=0) intervalSessions[existingIdx] = entry; else { intervalSessions.push(entry); intervalSessions.sort((a,b)=>a.date.localeCompare(b.date)); }
    Object.keys(draft).forEach(exId=>{
      const ex = exercises.find(e=>e.id===exId);
      if(!ex || ex.day!=='interval') return;
      const sets = draft[exId].filter(s=>(s.weight!==undefined&&s.weight!=='') || (s.reps!==undefined&&s.reps!=='') || (s.duration!==undefined&&s.duration!==''));
      saveOrClearExerciseEntry(date, 'interval', exId, sets);
    });
    persistDeletedSessionKeys();
    await saveSessions();
    await setNote(date, 'interval', (intervalNotesDraft||'').trim());
    await saveIntervals();
    saveIntBtn.textContent = 'Saved \u2713';
    saveIntBtn.classList.add('saved');
    setTimeout(()=>{ render(); },900);
  };

  const cardioDateInp = document.getElementById('cardioDate');
  if(cardioDateInp) cardioDateInp.onchange = ()=>{ initCardioDraft(cardioDateInp.value, null); initDraft('cardio', cardioDateInp.value); render(); };
  const cardioNewEntryBtn = document.getElementById('cardioNewEntryBtn');
  if(cardioNewEntryBtn) cardioNewEntryBtn.onclick = ()=>{ initCardioDraft(cardioDraftDate, null); initDraft('cardio', cardioDraftDate); render(); };
  const cardioActivityInp = document.getElementById('cardioActivity');
  if(cardioActivityInp) cardioActivityInp.oninput = ()=>{ cardioDraft.activity = cardioActivityInp.value; };
  ['cardioKm','cardioMin','cardioSec','cardioSpeed'].forEach(id=>{
    const el = document.getElementById(id);
    if(el) el.oninput = ()=>{
      const key = id==='cardioKm'?'km':id==='cardioMin'?'durationMin':id==='cardioSec'?'durationSec':'speed';
      cardioDraft[key] = el.value===''?'':parseFloat(el.value);
    };
  });
  const cardioEffortEl = document.getElementById('cardioEffort');
  if(cardioEffortEl) cardioEffortEl.onchange = ()=>{ cardioDraft.effort = cardioEffortEl.value; };
  const cardioNotesEl = document.getElementById('cardioNotesInput');
  if(cardioNotesEl) cardioNotesEl.oninput = ()=>{ cardioNotesDraft = cardioNotesEl.value; };
  document.querySelectorAll('[data-edit-cardio]').forEach(card=>{
    card.onclick = ()=>{
      const s = cardioSessions.find(x=>x.id===card.dataset.editCardio);
      if(!s) return;
      initCardioDraft(s.date, s.id);
      initDraft('cardio', s.date);
      render();
      window.scrollTo({top:0, behavior:'smooth'});
    };
  });
  const saveCardioBtn = document.getElementById('saveCardioBtn');
  if(saveCardioBtn) saveCardioBtn.onclick = async ()=>{
    const date = document.getElementById('cardioDate').value || cardioDraftDate;
    const min = cardioDraft.durationMin===''?0:(cardioDraft.durationMin||0);
    const sec = cardioDraft.durationSec===''?0:(cardioDraft.durationSec||0);
    const totalSec = Math.round(min*60 + sec);
    const entry = {
      id: cardioEditingId || (Date.now().toString(36)+Math.random().toString(36).slice(2,6)),
      date,
      activity: cardioDraft.activity || 'Cardio',
      km: cardioDraft.km===''?0:(cardioDraft.km||0),
      durationMin: Math.floor(totalSec/60),
      durationSec: totalSec%60,
      speed: cardioDraft.speed===''?undefined:cardioDraft.speed,
      effort: cardioDraft.effort || 'easy',
    };
    const existingIdx = cardioEditingId ? cardioSessions.findIndex(s=>s.id===cardioEditingId) : -1;
    if(existingIdx>=0) cardioSessions[existingIdx] = entry; else { cardioSessions.push(entry); cardioSessions.sort((a,b)=>a.date.localeCompare(b.date)); }
    cardioEditingId = entry.id;
    Object.keys(draft).forEach(exId=>{
      const ex = exercises.find(e=>e.id===exId);
      if(!ex || ex.day!=='cardio') return;
      const sets = draft[exId].filter(s=>(s.weight!==undefined&&s.weight!=='') || (s.reps!==undefined&&s.reps!=='') || (s.duration!==undefined&&s.duration!==''));
      saveOrClearExerciseEntry(date, 'cardio', exId, sets);
    });
    persistDeletedSessionKeys();
    await saveSessions();
    await setNote(date, 'cardio', (cardioNotesDraft||'').trim());
    await saveCardio();
    saveCardioBtn.textContent = 'Saved ✓';
    saveCardioBtn.classList.add('saved');
    setTimeout(()=>{ render(); },900);
  };
  document.querySelectorAll('[data-report-mode]').forEach(btn=>{
    btn.onclick = ()=>{ reportMode = btn.dataset.reportMode; render(); };
  });
  const reportDateInp = document.getElementById('reportDate');
  if(reportDateInp) reportDateInp.onchange = ()=>{ reportDate = reportDateInp.value; render(); };

  const copyBtn = document.getElementById('copyReportBtn');
  if(copyBtn) copyBtn.onclick = async ()=>{
    const ta = document.getElementById('reportText');
    try{
      await navigator.clipboard.writeText(ta.value);
    }catch(e){
      ta.removeAttribute('readonly');
      ta.select();
      document.execCommand('copy');
      ta.setAttribute('readonly','true');
    }
    copyBtn.textContent = 'Copied ✓';
    copyBtn.classList.add('saved');
    setTimeout(()=>{ copyBtn.textContent = 'Copy report'; copyBtn.classList.remove('saved'); },1500);
  };

  document.querySelectorAll('[data-del]').forEach(btn=>{
    btn.onclick = async ()=>{
      const id = btn.dataset.del;
      exercises = exercises.filter(e=>e.id!==id);
      if(!deletedExerciseIds.includes(id)){
        deletedExerciseIds.push(id);
        try{ localStorage.setItem(STORAGE_DELETED, JSON.stringify(deletedExerciseIds)); }catch(e){}
      }
      await saveExercises();
      render();
    };
  });
  const addExBtn = document.getElementById('addExBtn');
  if(addExBtn) addExBtn.onclick = async ()=>{
    const name = document.getElementById('newExName').value.trim();
    if(!name){ alert('Enter an exercise name.'); return; }
    const day = document.getElementById('newExDay').value;
    const unit = document.getElementById('newExUnit').value;
    const id = name.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,'') + '-' + Date.now().toString(36);
    exercises.push({id, day, name, unit, sets: unit==='sec' ? d4(30) : unit==='kg-sec' ? wd4(10,45) : s4(0,10)});
    await saveExercises();
    render();
  };

  const exportBtn = document.getElementById('exportBtn');
  const settingsWeightInp = document.getElementById('settingsWeight');
  if(settingsWeightInp) settingsWeightInp.onchange = ()=>{ userWeightKg = parseFloat(settingsWeightInp.value)||userWeightKg; saveSettings(); };
  const settingsHeightInp = document.getElementById('settingsHeight');
  if(settingsHeightInp) settingsHeightInp.onchange = ()=>{ userHeightCm = parseFloat(settingsHeightInp.value)||userHeightCm; saveSettings(); render(); };
  const settingsCadenceInp = document.getElementById('settingsCadence');
  if(settingsCadenceInp) settingsCadenceInp.onchange = ()=>{ userCadenceSpm = parseFloat(settingsCadenceInp.value)||userCadenceSpm; saveSettings(); render(); };
  const settingsPaceMinInp = document.getElementById('settingsPaceMin');
  if(settingsPaceMinInp) settingsPaceMinInp.onchange = ()=>{ userPaceMinPerKm = parseFloat(settingsPaceMinInp.value)||userPaceMinPerKm; saveSettings(); render(); };
  const settingsPaceCadenceInp = document.getElementById('settingsPaceCadence');
  if(settingsPaceCadenceInp) settingsPaceCadenceInp.onchange = ()=>{ userPaceCadenceSpm = parseFloat(settingsPaceCadenceInp.value)||userPaceCadenceSpm; saveSettings(); render(); };

  if(exportBtn) exportBtn.onclick = ()=>{
    const backup = JSON.stringify({exercises, sessions, intervalSessions, cardioSessions, sessionNotes}, null, 0);
    const ta = document.getElementById('backupText');
    const copyBackupBtn = document.getElementById('copyBackupBtn');
    ta.value = backup;
    ta.style.display = 'block';
    copyBackupBtn.style.display = 'block';
  };
  const copyBackupBtn = document.getElementById('copyBackupBtn');
  if(copyBackupBtn) copyBackupBtn.onclick = async ()=>{
    const ta = document.getElementById('backupText');
    try{ await navigator.clipboard.writeText(ta.value); }
    catch(e){ ta.removeAttribute('readonly'); ta.select(); document.execCommand('copy'); ta.setAttribute('readonly','true'); }
    copyBackupBtn.textContent = 'Copied ✓';
    setTimeout(()=>{ copyBackupBtn.textContent = 'Copy backup'; },1500);
  };
  const importBtn = document.getElementById('importBtn');
  if(importBtn) importBtn.onclick = async ()=>{
    const raw = document.getElementById('importText').value.trim();
    if(!raw){ alert('Paste a backup first.'); return; }
    try{
      const data = JSON.parse(raw);
      if(data.exercises) exercises = data.exercises;
      if(data.sessions) sessions = data.sessions;
      if(data.intervalSessions) intervalSessions = data.intervalSessions;
      if(data.cardioSessions) cardioSessions = data.cardioSessions;
      if(data.sessionNotes) sessionNotes = data.sessionNotes;
      await saveExercises(); await saveSessions(); await saveIntervals(); await saveCardio(); await saveNotes();
      alert('Backup restored.');
      render();
    }catch(e){
      alert('That doesn\'t look like a valid backup — check you copied the whole thing.');
    }
  };
}

(function init(){
  loadAll();
  initDraft('push');
  render();
})();
</script>
